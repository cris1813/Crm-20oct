function act(k,id,t){const c=cl(id);if(!norm(c.phone))return toast('Teléfono incompleto: edítalo en Datos');addLog(c,k=='c'?'llamada':'whatsapp',t?'Mensaje: '+t.slice(0,90):'');save();PEND={id,t:Date.now()};k=='c'?ext('tel:+'+norm(c.phone)):wa(id,t)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PEND){const p=PEND;PEND=null;if(Date.now()-p.t<18e5)setTimeout(()=>reg(p.id,'¿Cómo te fue?'),400)}});
const share=t=>{t=t.replace(/\{nombre\}/g,'');const s=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;s?s.share({text:t}).catch(()=>{}):ext('https://wa.me/?text='+encodeURIComponent(t))};
async function notify(c,r){try{const at=new Date(r.d+'T'+(r.h||'09:00')+':00');if(at<new Date())return;const l=Capacitor.Plugins.LocalNotifications;await l.requestPermissions();await l.schedule({notifications:[{id:r.id,title:'Contactar a '+c.name,body:r.x||'Recordatorio',schedule:{at}}]})}catch(x){}}
const unnotify=async id=>{try{await Capacitor.Plugins.LocalNotifications.cancel({notifications:[{id}]})}catch(x){}};
function addRem(c,d,x,h){const r={id:uid(),d,x,h:h||'',ok:0};c.rems.push(r);notify(c,r)}
function reg(id,title){const c=cl(id);$('#sh').innerHTML=`<div class="bx"><div class="gr"></div><h3>${title} · ${e(first(c.name))}</h3><div class="ch">${[['No contestó',1],['Pidió cotización',3],['Interesado',3],['Sin interés',14],['Pedir que llame después',1]].map(([t,n])=>`<span onclick="pickOut('${t}',${n})">${t}</span>`).join('')}</div><textarea id="an" placeholder="Nota: ¿qué pasó?"></textarea><input id="am" type="number" inputmode="numeric" placeholder="Monto de compra $ (solo si compró)"><label>⏰ Recordarme</label><div class="ch" id="rc">${[[0,'No'],[1,'Mañana'],[3,'En 3 días'],[7,'En 1 semana'],[14,'En 2 semanas']].map(([n,l],i)=>`<span class="${i?'':'on'}" data-n="${n}" onclick="pickR(this)">${l}</span>`).join('')}</div><button class="b g" style="width:100%;margin-top:10px" onclick="saveReg(${id})">Guardar</button></div>`;openS()}
function pickR(el){document.querySelectorAll('#rc span').forEach(x=>x.className='');el.className='on'}
function saveReg(id){const c=cl(id),x=$('#an').value.trim(),m=+$('#am').value||0,n=+document.querySelector('#rc .on').dataset.n;if(m){addLog(c,'compra',x,m);repo(c);addRem(c,dAgo(-1),'Postventa: confirmar entrega y agradecer');burst()}else if(x)addLog(c,'nota',x);if(n)addRem(c,dAgo(-n),'Seguimiento'+(x?': '+x:''));save();closeS();toast('Guardado');go(cur);if(CPI>=0&&CP[CPI]&&CP[CPI].c.id==id)setTimeout(()=>coachSheet(CPI+1),350)}
function addR(id){const d=$('#rd').value;if(!d)return toast('Elige una fecha');addRem(cl(id),d,$('#rt').value.trim()||'Contactar',$('#rh').value);save();sheet(id,'r');toast('Recordatorio creado')}
function doneR(cid,rid,fromHoy,el){const r=cl(cid).rems.find(r=>r.id==rid);r.ok=r.ok?0:1;if(r.ok){unnotify(r.id);burst(el)}save();if(!fromHoy)return sheet(cid,'r');const cd=el&&el.closest('.card');if(cd){cd.style.maxHeight=cd.offsetHeight+'px';cd.offsetHeight;cd.classList.add('out');setTimeout(()=>go('hoy'),380)}else go('hoy')}
function delR(cid,rid){const c=cl(cid);unnotify(rid);c.rems=c.rems.filter(r=>r.id!=rid);save();sheet(cid,'r')}
function snooze(cid,rid){const c=cl(cid),r=c.rems.find(r=>r.id==rid);r.d=dAgo(-1);unnotify(r.id);notify(c,r);save();go('hoy')}
function delLog(cid,lid){const c=cl(cid);c.log=c.log.filter(l=>l.id!=lid);save();sheet(cid,'h')}
const openS=()=>{const s=$('#sh');s.offsetHeight;s.className='on'},closeS=()=>{$('#sh').className=''};
$('#sh').onclick=ev=>{if(ev.target.id=='sh'){CPI=-1;closeS()}};

const row=(c,i,x='')=>`<div class="card" style="animation-delay:${Math.min(i,10)*35}ms"><div class="r" onclick="sheet(${c.id},'h')"><div class="av">${e(c.name[0])}</div><div class="f"><b>${c.vip?'⭐ ':''}${e(c.name)}</b><small><span class="tg" onclick="event.stopPropagation();pickCat(${c.id})">${e(CATS[c.cat])}</span>${tot(c)?' · '+money(tot(c)):''}${c.note?' · '+e(c.note):''}</small>${x}</div></div><div class="ac"><button class="b" onclick="act('c',${c.id})">📞 Llamar</button><button class="b g" onclick="act('w',${c.id},'')">💬 WhatsApp</button></div></div>`;

const rrow=(c,r,i)=>`<div class="card" style="animation-delay:${Math.min(i,10)*35}ms"><div class="r" onclick="sheet(${c.id},'r')"><div class="av">${e(c.name[0])}</div><div class="f"><b>${e(c.name)}</b><div>${e(r.x)}</div><small class="${r.d<today()?'rd':''}">${r.d<today()?'Atrasado · ':'Hoy · '}${r.d}${r.h?' '+r.h:''}</small></div></div><div class="ac"><button class="b" onclick="act('c',${c.id})">📞</button><button class="b g" onclick="act('w',${c.id},'')">💬</button><button class="b l" onclick="snooze(${c.id},${r.id})">+1 día</button><button class="b o" onclick="doneR(${c.id},${r.id},1,this)">✓ Hecho</button></div></div>`;
function hoy(){const t=today(),due=[];S.c.forEach(c=>c.rems.forEach(r=>{if(!r.ok&&r.d<=t)due.push([c,r])}));due.sort((a,b)=>(a[1].d+(a[1].h||''))<(b[1].d+(b[1].h||''))?-1:1);
const mo=new Date();mo.setDate(1);mo.setHours(0,0,0,0);const mes=S.c.reduce((n,c)=>n+buys(c).filter(l=>l.t>=mo.getTime()).reduce((a,l)=>a+l.m,0),0);
const old=dAgo(14),cold=S.c.filter(c=>norm(c.phone)&&(!c.last||c.last<old)&&!c.rems.some(r=>!r.ok)).slice(0,8);
const rea=S.c.filter(c=>buys(c).length&&Date.now()-lastBuy(c)>2592e6).sort((a,b)=>tot(b)-tot(a)).slice(0,5);
return `<div class="st"><div><b data-n="${S.c.length}">${S.c.length}</b>clientes</div><div><b data-n="${due.length}">${due.length}</b>para hoy</div><div><b data-n="${mes}" data-m="1">${money(mes)}</b>vendido este mes</div></div>
${coachBlock()}<h3>⏰ Para contactar hoy</h3>${due.map((x,i)=>rrow(x[0],x[1],i)).join('')||'<p class="mu">Todo al día. Crea recordatorios desde la ficha de cada cliente.</p>'}
${rea.length?'<h3>🔁 Por reactivar (+30 días sin comprar)</h3>'+rea.map((c,i)=>row(c,i,'<small>Última compra hace '+Math.floor((Date.now()-lastBuy(c))/864e5)+' días</small>')).join(''):''}
<h3>💡 Sin contacto hace más de 14 días</h3>${cold.map((c,i)=>row(c,i)).join('')}`}
let F='',Q='',SO='n';const srt=(a,b)=>SO=='t'?tot(b)-tot(a):SO=='b'?(lastBuy(a)||9e15)-(lastBuy(b)||9e15):SO=='c'?(b.last||'').localeCompare(a.last||''):a.name.localeCompare(b.name);

const cnt=k=>k==''?S.c.length:k=='vip'?S.c.filter(c=>c.vip).length:S.c.filter(c=>c.cat==k).length;
const selRow=(c,i)=>`<div class="card sel ${SEL.has(c.id)?'on':''}" style="animation-delay:${Math.min(i,10)*25}ms" onclick="togSel(${c.id},this)"><div class="r"><div class="av">${SEL.has(c.id)?'✓':e(c.name[0])}</div><div class="f"><b>${e(c.name)}</b><small>${e(CATS[c.cat])}</small></div></div></div>`;
function cli(){return `<div class="ac" style="margin-top:0"><button class="b o" onclick="sheet(0)">＋ Cliente</button><button class="b l" onclick="catSheet()">🗂 Categorías</button><button class="b l" onclick="togSelM()">${SELM?'✕ Cancelar':'☑ Mover'}</button></div><input id="q" placeholder="Buscar nombre, RUT o teléfono" value="${e(Q)}" oninput="Q=this.value;fl()"><select onchange="SO=this.value;fl()">${[['n','Ordenar: Nombre'],['t','Ordenar: Más compras ($)'],['b','Ordenar: Compró hace más tiempo'],['c','Ordenar: Último contacto']].map(([k,v])=>`<option value="${k}" ${SO==k?'selected':''}>${v}</option>`).join('')}</select><div class="ch">${[['','Todos'],['vip','⭐ VIP'],...Object.entries(CATS)].map(([k,v])=>`<span class="${F==k?'on':''}" onclick="F='${k}';go('cli')">${e(v)}<sup style="opacity:.6;margin-left:4px">${cnt(k)}</sup></span>`).join('')}</div>${SELM?'<small>Toca los clientes que quieras mover. <u onclick="selAll()">Seleccionar todos los de esta lista</u></small>':''}<div id="L"></div>`}
function fl(){$('#L').innerHTML=flist().map((c,i)=>SELM?selRow(c,i):row(c,i)).join('')||'<p class="mu">Sin resultados.</p>'}
function togSelM(){SELM=!SELM;SEL.clear();go('cli')}
function togSel(id,el){SEL.has(id)?SEL.delete(id):SEL.add(id);el.classList.toggle('on',SEL.has(id));el.querySelector('.av').textContent=SEL.has(id)?'✓':cl(id).name[0];$('#sn').textContent=SEL.size}
function selAll(){flist().forEach(c=>SEL.add(c.id));fl();$('#sn').textContent=SEL.size}
function selBar(){const v=$('#mv')?$('#mv').value:'';$('#sb').innerHTML=`<span style="white-space:nowrap"><b id="sn">${SEL.size}</b> sel.</span><select id="mv" style="margin:0;flex:1">${Object.entries(CATS).map(([k,x])=>`<option value="${k}">${e(x)}</option>`).join('')}</select><button class="b g" style="flex:none;width:84px" onclick="moveSel()">Mover</button>`;if(v&&$('#mv'))$('#mv').value=v}
function moveSel(){if(!SEL.size)return toast('Selecciona clientes primero');const k=$('#mv').value,n=SEL.size;S.c.forEach(c=>{if(SEL.has(c.id))c.cat=k});SEL.clear();SELM=false;save();go('cli');burst();toast(n+' clientes movidos a '+CATS[k])}
function pickCat(id){const c=cl(id);$('#sh').innerHTML=`<div class="bx"><div class="gr"></div><h3>Mover a categoría</h3><small>${e(c.name)}</small><div class="ch" style="flex-wrap:wrap;margin-top:8px">${Object.entries(CATS).map(([k,v])=>`<span class="${c.cat==k?'on':''}" onclick="setCat(${id},'${k}')">${e(v)}</span>`).join('')}<span onclick="catSheet()">＋ Nueva…</span></div></div>`;openS()}
function setCat(id,k){cl(id).cat=k;save();closeS();go(cur);toast('Movido a '+CATS[k])}
function catSheet(){$('#sh').innerHTML=`<div class="bx"><div class="gr"></div><h3>Categorías</h3><small>Crea, renombra o elimina. Al eliminar una, sus clientes pasan a “Sin clasificar”.</small>${Object.entries(CATS).map(([k,v])=>`<div class="le"><div class="f"><input value="${e(v)}" onchange="renCat('${k}',this.value)" style="margin:0"><small>${S.c.filter(c=>c.cat==k).length} clientes</small></div>${k=='X'?'':`<i onclick="delCat('${k}')">🗑</i>`}</div>`).join('')}<div class="r" style="margin-top:12px"><input id="nc" placeholder="Nueva categoría (ej: 🥖 Panaderías)"><button class="b g" style="flex:none;width:96px" onclick="addCat()">＋ Crear</button></div></div>`;openS()}
function renCat(k,v){v=v.trim();if(!v)return;S.cats[k]=v;syncCats();save();go(cur);toast('Renombrada')}
function addCat(){const v=$('#nc').value.trim();if(!v)return toast('Escribe un nombre');S.cats['c'+uid()]=v;syncCats();save();catSheet();go(cur);toast('Categoría creada')}
function delCat(k){if(!confirm('¿Eliminar «'+CATS[k]+'»? Sus clientes pasarán a Sin clasificar.'))return;S.c.forEach(c=>{if(c.cat==k)c.cat='X'});delete S.cats[k];if(F==k)F='';if(S.camp.cat==k)S.camp.cat='';syncCats();save();catSheet();go(cur)}
let TB='h';
function sheet(id,tab){const c=id?cl(id):null;TB=c?(tab||TB):'d';const c0=c||{name:'',phone:'',rut:'',cat:'X',note:'',vip:0};
const pe=c?c.rems.filter(r=>!r.ok).length:0;
const head=c?`<h3 style="margin:6px 0 2px">${c.vip?'⭐ ':''}${e(c.name)}</h3><small><span class="tg" onclick="pickCat(${id})">${e(CATS[c.cat])}</span> · ${buys(c).length} compras · ${money(tot(c))}</small><div class="ac"><button class="b" onclick="act('c',${id})">📞 Llamar</button><button class="b g" onclick="act('w',${id},'')">💬 WhatsApp</button></div><div class="ch">${[['h','Historial'],['r','Recordatorios'+(pe?' ('+pe+')':'')],['d','Datos']].map(([k,v])=>`<span class="${TB==k?'on':''}" onclick="sheet(${id},'${k}')">${v}</span>`).join('')}</div>`:'<h3>Nuevo cliente</h3>';
$('#sh').innerHTML=`<div class="bx"><div class="gr"></div>${head}${TB=='h'?hist(c):TB=='r'?remsV(c):datos(id,c0)}</div>`;openS()}
const hist=c=>`<button class="b o" style="width:100%;margin:8px 0" onclick="reg(${c.id},'Nuevo registro')">＋ Agregar nota o compra</button><div class="r"><select id="sp">${S.p.map(p=>`<option value="${p.id}">${e(p.t)}</option>`).join('')}</select><button class="b g" style="flex:none;width:112px" onclick="sendP(${c.id})">Enviar promo</button></div>${c.note?`<div class="m a" style="max-width:100%">📌 ${e(c.note)}</div>`:''}<div>${c.log.map(l=>`<div class="le"><span>${ICON[l.k]||'•'}</span><div class="f"><b>${l.k=='compra'?'Compra '+money(l.m):l.k[0].toUpperCase()+l.k.slice(1)}</b>${l.x?`<div>${e(l.x)}</div>`:''}<small>${fd(l.t)}</small></div><i onclick="delLog(${c.id},${l.id})">✕</i></div>`).join('')||'<p class="mu">Aún no hay registros. Cada llamada o WhatsApp se anota solo.</p>'}</div>`;
const cmpR=(a,b)=>a.ok-b.ok||(a.d+(a.h||'')<b.d+(b.h||'')?-1:1);
const remsV=c=>{const t=today();return `<div class="card"><input id="rt" placeholder="¿Qué debo hacer? (ej: ofrecer pallet de papel)"><div class="r"><input id="rd" type="date" value="${dAgo(-1)}"><input id="rh" type="time" value="09:00"></div><div class="ch">${[1,3,7,14].map(n=>`<span onclick="$('#rd').value=dAgo(-${n})">en ${n} días</span>`).join('')}</div><button class="b o" style="width:100%" onclick="addR(${c.id})">＋ Agregar recordatorio</button></div>${[...c.rems].sort(cmpR).map(r=>{const late=!r.ok&&r.d<t;return `<div class="le"><span onclick="doneR(${c.id},${r.id})">${r.ok?'✅':late?'🔴':'⬜'}</span><div class="f"><b style="${r.ok?'text-decoration:line-through;opacity:.5':''}">${e(r.x)}</b><small class="${late?'rd':''}">${r.d}${r.h?' '+r.h:''}${late?' · atrasado':''}</small></div><i onclick="delR(${c.id},${r.id})">✕</i></div>`}).join('')||'<p class="mu">Sin recordatorios.</p>'}`};
const datos=(id,c)=>`<input id="fn" placeholder="Nombre" value="${e(c.name)}"><input id="fp" type="tel" placeholder="Teléfono (9XXXXXXXX)" value="${e(c.phone)}"><input id="fr" placeholder="RUT" value="${e(c.rut)}"><select id="fc">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k==c.cat?'selected':''}>${v}</option>`).join('')}</select><textarea id="fo" placeholder="Nota fija (perfil del cliente)">${e(c.note)}</textarea><label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input id="fv" type="checkbox" style="width:auto;margin:0" ${c.vip?'checked':''}> ⭐ Cliente VIP</label><div class="ac">${id?`<button class="b l" onclick="draftFor(${id})">✨ Mensaje con IA</button><button class="b l" onclick="summ(${id})">🧠 Resumir</button>`:''}<button class="b g" onclick="saveC(${id})">Guardar</button></div>${id?`<button class="b l" style="width:100%;margin-top:8px;color:var(--rd)" onclick="delC(${id})">Eliminar cliente</button>`:''}`;
function saveC(id){const c=id?cl(id):{id:uid(),last:'',rems:[],log:[]};Object.assign(c,{name:$('#fn').value.trim()||'Sin nombre',phone:$('#fp').value,rut:$('#fr').value,cat:$('#fc').value,note:$('#fo').value,vip:$('#fv').checked?1:0});const d=S.c.find(x=>x!==c&&norm(x.phone)&&norm(x.phone)==norm(c.phone));if(!id)S.c.unshift(c);save();closeS();toast(d?'Guardado. Ojo: mismo teléfono que '+d.name:'Guardado');go(cur)}
function delC(id){if(!confirm('¿Eliminar este cliente y todo su historial?'))return;cl(id).rems.forEach(r=>unnotify(r.id));S.c=S.c.filter(x=>x.id!=id);save();closeS();go(cur)}
function sendP(id){const p=S.p.find(x=>x.id==$('#sp').value);if(!p)return toast('Primero crea una promoción');act('w',id,fill(p.x,cl(id)))}
function cfg(){$('#sh').innerHTML=`<div class="bx"><div class="gr"></div><h3>Ajustes y respaldo</h3><small>${S.c.length} clientes · ${S.c.reduce((n,c)=>n+c.log.length,0)} registros</small><label>🎯 Meta de ventas del mes ($)</label><input type="number" inputmode="numeric" placeholder="Ej: 5000000" value="${S.meta.mes||''}" onchange="S.meta.mes=+this.value;save()"><label>📞 Contactos por día</label><input type="number" inputmode="numeric" value="${S.meta.dia}" onchange="S.meta.dia=+this.value||10;save()"><button class="b o" style="width:100%;margin:10px 0" onclick="expo()">Copiar respaldo</button><textarea id="imp" placeholder="Para restaurar: pega aquí el respaldo"></textarea><button class="b l" style="width:100%" onclick="impo()">Restaurar respaldo</button><p class="mu">Haz un respaldo cada semana y pégalo en un chat contigo mismo de WhatsApp. Las imágenes de las promociones no se incluyen.</p></div>`;openS()}

function pro(){return `<button class="b o" onclick="psheet(0)">＋ Nueva promoción</button>${S.p.map((p,i)=>`<div class="card" style="animation-delay:${i*40}ms"><img id="th${p.id}" class="th" alt=""><b>${e(p.t)}</b><small>${e(p.x).replace(/\n/g,'<br>')}</small><div class="ac"><button class="b l" onclick="psheet(${p.id})">Editar</button><button class="b" onclick="shareP(${p.id})">Compartir</button><button class="b g" onclick="S.camp.p=${p.id};save();go('cam')">Campaña</button></div></div>`).join('')}`}

let PF={},PM='g',PT='',PX='',TMPIMG=null,PID=0;
const fdate=d=>new Date(d+'T12:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
const TIPOS={o:['🏷️','OFERTA'],s:['🆕','LLEGÓ STOCK'],c:['⏳','CORTA FECHA'],r:['🔁','REPOSICIÓN']};
const wbHtml=(t,n)=>e(t.replace(/\{nombre\}/g,n)).replace(/\*([^*]+)\*/g,'<b>$1</b>');
function build(f){const T=TIPOS[f.k||'o'],L=['Hola {nombre} 👋','',T[0]+' *'+T[1]+(f.t?': '+f.t:'')+'*'];(f.l||'').split('\n').filter(x=>x.trim()).forEach(x=>L.push('• '+x.trim()));if(f.c)L.push('📦 '+f.c);if(f.v)L.push('📅 Válido hasta el '+fdate(f.v));if(f.d)L.push('🚚 '+f.d);L.push('','👉 '+(f.a||'Responde *SÍ* y te lo reservo.'));return L.join('\n')}
function chk(f){const tx=(f.t||'')+(f.l||''),n=(f.l||'').split('\n').filter(x=>x.trim()).length;return [[!!f.t,'Título claro del producto'],[/\$\s?\d/.test(tx),'Precio visible (ej: $1.990)'],[!!f.c,'Mínimo o condición de compra'],[!!f.v,'Fecha hasta cuándo vale'],[n<=5,'Máximo 5 productos por mensaje'],[build(f).length<=480,'Mensaje corto, se lee de un vistazo']].map(([b,t])=>(b?'✅ ':'⚠️ ')+t)}
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('crm',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbSet=async(k,v)=>{const d=await idb();return new Promise(ok=>{const t=d.transaction('img','readwrite'),o=t.objectStore('img');v===null?o.delete(k):o.put(v,k);t.oncomplete=()=>ok()})};

// ===== Reposición inteligente: calcula cada cuántos días compra y agenda el recordatorio =====
function repo(c){const b=buys(c).map(l=>l.t).sort((a,z)=>a-z);if(b.length<2)return;let t=0;for(let i=1;i<b.length;i++)t+=(b[i]-b[i-1])/864e5;const avg=Math.round(t/(b.length-1));if(avg<3)return;c.rems.filter(r=>!r.ok&&r.x.startsWith('Reposición')).forEach(r=>{unnotify(r.id);r.ok=1});addRem(c,dAgo(-Math.max(1,avg-2)),'Reposición probable: ofrecer pedido (compra cada ~'+avg+' días)')}

// ===== Coach de ventas: a quién llamar y qué decir =====
function score(c){const t=Date.now(),why=[],bs=buys(c),lb=lastBuy(c),dl=lb?(t-lb)/864e5:0;let s=0,kind='frio';
const dr=c.rems.filter(r=>!r.ok&&r.d<=today());if(dr.length){s+=50;why.push('Recordatorio: '+dr[0].x);kind='rem'}
if(bs.length>=2){const b=bs.map(l=>l.t).sort((a,z)=>a-z);let q=0;for(let i=1;i<b.length;i++)q+=(b[i]-b[i-1])/864e5;const avg=q/(b.length-1);if(avg>=3&&dl>=avg*.85){s+=40+Math.min(20,Math.round(dl-avg));why.push('Suele comprar cada ~'+Math.round(avg)+' días y van '+Math.round(dl));if(kind!='rem')kind='repo'}}
else if(bs.length==1&&dl>30){s+=20;why.push('Compró hace '+Math.round(dl)+' días');if(kind=='frio')kind='repo'}
const T=tot(c);if(T>0)s+=Math.min(20,Math.round(Math.log10(T+1)*3));
if(c.vip){s+=10;why.push('Cliente VIP')}
const ds=c.last?(t-new Date(c.last+'T12:00').getTime())/864e5:999;
if(ds>30){s+=20;why.push(c.last?'Sin contacto hace '+Math.round(ds)+' días':'Aún sin contactar en la app')}else if(ds>14){s+=10;why.push('Sin contacto hace '+Math.round(ds)+' días')}
if(ds<1)s-=100;else if(ds<3)s-=30;
if(/llamar/i.test(c.note))s+=5;
if(!bs.length&&kind=='frio'&&/mill|todo|mucho|top|pallet|500\.000|600/i.test(c.note)){s+=15;why.push('Por sus notas, compra bastante');kind='pot'}
const o=outcome(c);if(o){const dd=Math.round(o.d);
if(o.k=='cot'&&o.d>=1&&o.d<=21){s+=55;why.unshift('Pidió cotización hace '+dd+' d: ciérrala');kind='cot'}
else if(o.k=='int'&&o.d>=2&&o.d<=21){s+=35;why.unshift('Mostró interés hace '+dd+' d');kind='int'}
else if(o.k=='nc'&&o.d>=1&&o.d<=10){const n=ncN(c);if(n>=3){s-=25;why.unshift(n+' intentos sin respuesta: cambia de canal o pausa')}else{s+=30;why.unshift('No contestó hace '+dd+' d: reintenta ('+n+(n==1?' intento)':' intentos)'))}kind='nc'}
else if(o.k=='cb'&&o.d>=1){s+=40;why.unshift('Pidió que lo llamen: cumple tu palabra');kind='cb'}
else if(o.k=='no'&&o.d<30){s-=80;why.push('Dijo que no tiene interés (esperar)')}
else why.push(o.n+' hace '+dd+' d')}
return {c,s,why,kind}}
const plan=k=>{const a=S.c.filter(c=>norm(c.phone)).map(score);return k?a.filter(x=>{const o=outcome(x.c);return o&&o.k==k}).map(x=>({...x,kind:k})).sort((a,b)=>b.s-a.s).slice(0,15):a.filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8)};
let CP=[],CPI=-1,CPK='';
function guion(x){const n=first(x.c.name),pr=S.p[0]?S.p[0].t:'la oferta de la semana';const K={rem:['Recuerda el motivo: '+(x.why[0]||'seguimiento')+'.','Pregunta cómo va y si ya lo resolvió.'],repo:['Dile: «Vi que ya te toca reponer, ¿cuánto stock te queda?»','Escucha y ofrécele su pedido habitual.'],pot:['Pregunta: «¿Qué productos son los que más se te mueven?»','Ofrece cotización por volumen o pallet.'],frio:['Pregunta cómo va el negocio y qué se le ha estado faltando.','Cuéntale las novedades de la bodega.'],cot:['Pregunta si pudo revisar la cotización y qué le pareció.','Resuelve dudas (precio, cantidad, entrega) y ofrece cerrar hoy con entrega confirmada.'],int:['Retoma lo que le interesó y pregunta qué necesita para decidir.','Propón una cantidad concreta y una fecha de entrega.'],nc:['Escríbele un WhatsApp breve en vez de llamar otra vez.','Si no responde, prueba en otro horario (temprano en la mañana o al cierre).'],cb:['Dile: «Quedamos en que te llamaba hoy, ¿es buen momento?»','Si no puede, agenda una hora exacta y cúmplela.']};
return ['Saluda por su nombre: «Hola '+n+', ¿cómo estás? Soy [tu nombre] de la bodega».',...(K[x.kind]||K.frio),'Ofrece «'+pr+'» diciendo precio, mínimo y hasta cuándo vale.','Pide una decisión: «¿Te armo el pedido para el [día]?» y confirma cantidad y entrega.','Agradece y anota el resultado en la app.']}
function coachMsg(i){const x=CP[i],p=S.p[0],b={repo:'Hola {nombre} 👋 Te escribo porque ya te toca reponer. ¿Te armo tu pedido de siempre?',pot:'Hola {nombre} 👋 Soy de la bodega. Tengo precios por volumen que te pueden servir. ¿Te envío una cotización?',cot:'Hola {nombre} 👋 ¿Pudiste revisar la cotización que te pasé? Si quieres la dejamos confirmada hoy con la entrega coordinada.',int:'Hola {nombre} 👋 Quedé pensando en lo que conversamos. ¿Te armo el pedido para esta semana?',nc:'Hola {nombre} 👋 Te llamé y no pude contactarte. ¿A qué hora te acomoda que hablemos?',cb:'Hola {nombre} 👋 Quedé de llamarte hoy. ¿Te va bien que te llame ahora?'}[x.kind]||'Hola {nombre} 👋 ¿Cómo va el negocio? Tenemos novedades en la bodega.';return fill(b,x.c)+(p&&['repo','pot','frio','int'].includes(x.kind)?'\n\nEsta semana: *'+p.t+'*. ¿Te la reservo?':'')}
function coachSheet(i,k){if(k!==undefined)CPK=k;if(i==0||!CP.length)CP=plan(CPK);if(i>=CP.length){CPI=-1;closeS();if(CP.length)burst();return toast(CP.length?'¡Lista terminada! 💪':'Nada pendiente por ahora')}CPI=i;const x=CP[i],c=x.c;
$('#sh').innerHTML=`<div class="bx"><div class="gr"></div><small>Cliente ${i+1} de ${CP.length} · ${prio(x.s)}</small><h3 style="margin:2px 0">${c.vip?'⭐ ':''}${e(c.name)}</h3><small>${e(c.note)}</small><div class="m a" style="max-width:100%">🎯 <b>Por qué ahora</b><br>${x.why.map(w=>e(w)).join('<br>')||'Buen momento para retomar contacto'}</div>${CAD[x.kind]?`<small style="margin-top:6px">🧭 ${CAD[x.kind]}</small>`:''}<h3>Guion paso a paso</h3>${guion(x).map((t,n)=>`<div class="le"><span>${n+1}</span><div class="f">${e(t)}</div></div>`).join('')}<div class="ac"><button class="b" onclick="act('c',${c.id})">📞 Llamar</button><button class="b g" onclick="act('w',${c.id},coachMsg(${i}))">💬 WhatsApp</button></div><div class="ac"><button class="b l" onclick="guionIA(${i})">✨ Guion con IA</button><button class="b l" onclick="reg(${c.id},'Resultado')">📝 Registrar</button><button class="b o" onclick="coachSheet(${i+1})">Siguiente ➜</button></div></div>`;openS()}
function guionIA(i){const x=CP[i],c=x.c;CPI=-1;closeS();AI.cid=c.id;go('ia');ask('Dame un guion de llamada de ventas corto para '+c.name+'. Motivo: '+x.why.join('; ')+'. Perfil: '+c.note+'. Historial: '+hx(c)+'. Promo vigente: '+(S.p[0]?S.p[0].t:'ninguna')+'. Responde con 5 pasos numerados.')}
function planIA(){const pl=plan().slice(0,5);AI.cid=0;ask('Soy vendedor de una bodega mayorista. Mis mejores contactos para hoy: '+pl.map((x,i)=>(i+1)+') '+x.c.name+' ('+x.why.slice(0,2).join(', ')+')').join('; ')+'. Dime en qué orden llamarlos, qué decirle a cada uno en una frase y cómo cerrar la venta.')}
function coachBlock(){const pl=plan(),d0=new Date();d0.setHours(0,0,0,0);const hn=S.c.reduce((n,c)=>n+c.log.filter(l=>l.t>=d0.getTime()&&(l.k=='llamada'||(l.k=='whatsapp'&&!/^Auto:/.test(l.x)))).length,0),M=S.meta,dm=M.dia||10;
const mo=new Date();mo.setDate(1);mo.setHours(0,0,0,0);const mes=S.c.reduce((n,c)=>n+buys(c).filter(l=>l.t>=mo.getTime()).reduce((a,l)=>a+l.m,0),0),dias=Math.max(1,new Date(mo.getFullYear(),mo.getMonth()+1,0).getDate()-new Date().getDate()+1),falta=Math.max(0,M.mes-mes);
const g=M.mes>0?'Meta '+money(M.mes)+': llevas '+money(mes)+' ('+Math.min(100,Math.round(mes/M.mes*100))+'%). Te faltan '+money(falta)+', o sea '+money(falta/dias)+' por día.':'Define tu meta del mes en ⚙️ y el coach te dirá cuánto vender por día.';
return `<h3>🎯 Coach de ventas</h3><div class="card"><b>Hoy: ${hn} de ${dm} contactos</b><div class="pg"><i style="width:${Math.min(100,hn/dm*100)}%"></i></div><small>${g}</small>${pipeChips()}<button class="b o" style="width:100%;margin-top:8px" onclick="coachSheet(0,'')">▶ Empezar: ${pl.length} clientes recomendados</button></div>${pl.slice(0,3).map((x,i)=>row(x.c,i,'<small>'+prio(x.s)+' · '+e(x.why.slice(0,2).join(' · '))+'</small>')).join('')}`}

// ===== Seguimiento inteligente =====
const OUT=[['cot',/cotiz/i,'Pidió cotización'],['int',/interesad/i,'Interesado'],['nc',/no contest/i,'No contestó'],['no',/sin inter/i,'Sin interés'],['cb',/llame despu|llamar despu/i,'Pidió que lo llamen después']];
function outcome(c){for(const l of c.log){if(l.k=='compra')return null;if(l.k=='nota'){for(const o of OUT)if(o[1].test(l.x))return {k:o[0],t:l.t,d:(Date.now()-l.t)/864e5,n:o[2]}}}return null}
function ncN(c){let n=0;for(const l of c.log){if(l.k=='compra')break;if(l.k=='nota'){if(/no contest/i.test(l.x))n++;else if(OUT.some(o=>o[0]!='nc'&&o[1].test(l.x)))break}}return n}
const prio=s=>s>=90?'🔥 Prioridad alta':s>=55?'⚡ Prioridad media':'🙂 Prioridad baja';
const CAD={cot:'Meta: cerrar la venta o dejar fecha de decisión. Si no avanza, vuelve en 3 días.',int:'Meta: pasar de interés a pedido con cantidad y fecha.',nc:'Secuencia: WhatsApp breve → llamada mañana → último aviso en 3 días.',cb:'Meta: cumplir la hora acordada. La puntualidad genera confianza.',repo:'Meta: asegurar su pedido de reposición antes de que compre a otro.',pot:'Meta: conocer qué compra y lograr una primera cotización.',frio:'Meta: retomar la relación y detectar qué necesita.',rem:'Meta: cumplir lo que te propusiste y registrar el resultado.'};
function pipe(){const r={cot:0,int:0,nc:0,cb:0};S.c.forEach(c=>{const o=outcome(c);if(o&&r[o.k]!==undefined&&o.d<=21)r[o.k]++});return r}
function pipeChips(){const p=pipe(),L=[['cot','📋 Cotizaciones'],['int','🔥 Interesados'],['nc','📵 Sin respuesta'],['cb','⏰ Llamar después']].filter(([k])=>p[k]);return L.length?'<div class="ch">'+L.map(([k,l])=>`<span onclick="coachSheet(0,'${k}')">${l} ${p[k]}</span>`).join('')+'</div>':''}
function pickOut(t,n){$('#an').value=t;const x=document.querySelector('#rc [data-n="'+n+'"]');if(x)pickR(x)}
function ctx(){const pl=plan().slice(0,4),p=pipe();return ('Contexto de hoy: '+(pl.length?'prioridades: '+pl.map(x=>x.c.name+' ('+x.why[0]+')').join('; ')+'. ':'')+'Cotizaciones abiertas: '+p.cot+', interesados: '+p.int+', sin respuesta: '+p.nc+'.').slice(0,450)}
const contactsToday=()=>{const d=new Date();d.setHours(0,0,0,0);return S.c.reduce((n,c)=>n+c.log.filter(l=>l.t>=d.getTime()&&(l.k=='llamada'||(l.k=='whatsapp'&&!/^Auto:/.test(l.x)))).length,0)};
function followIA(){const a=S.c.map(c=>[c,outcome(c)]).filter(a=>a[1]&&['cot','int','nc','cb'].includes(a[1].k)&&a[1].d<=21).sort((a,b)=>a[1].d-b[1].d).slice(0,4);if(!a.length)return toast('No tienes seguimientos abiertos');AI.cid=0;ask('Estos clientes esperan seguimiento: '+a.map(([c,o])=>c.name+' ('+o.n+' hace '+Math.round(o.d)+' d)').join('; ')+'. Escribe un mensaje de WhatsApp corto para cada uno que le facilite decidir.')}
function coachIA(){const pl=plan();if(!pl.length)return toast('No hay prioridades por ahora');const x=pl[0];AI.cid=x.c.id;ask('Llevo '+contactsToday()+' de '+(S.meta.dia||10)+' contactos hoy. Mi siguiente cliente es '+x.c.name+' ('+x.why.slice(0,2).join(', ')+'). Dime exactamente qué hacer ahora, paso a paso, y cómo responder si dice que no.')}

// ===== Efectos =====
function burst(el){const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};for(let i=0;i<14;i++){const f=document.createElement('div');f.className='fx';f.textContent=['🎉','✨','⭐','💚','🔥'][i%5];f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+r.height/2)+'px';f.style.setProperty('--x',(Math.random()*240-120)+'px');f.style.setProperty('--y',(-Math.random()*200-40)+'px');f.style.setProperty('--r',(Math.random()*360-180)+'deg');document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}}
function countUp(){document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,m=el.dataset.m,t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/800),v=n*(1-Math.pow(1-k,3));el.textContent=m?money(v):Math.round(v);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
(function(){let y0=0,dy=0,dr=null;const sh=$('#sh');sh.addEventListener('touchstart',ev=>{const g=ev.target.closest('.gr');if(g){dr=g.parentElement;y0=ev.touches[0].clientY;dy=0;dr.style.transition='none'}},{passive:true});sh.addEventListener('touchmove',ev=>{if(dr){dy=Math.max(0,ev.touches[0].clientY-y0);dr.style.transform='translateY('+dy+'px)'}},{passive:true});sh.addEventListener('touchend',()=>{if(dr){dr.style.transition='';dr.style.transform='';if(dy>110){CPI=-1;closeS()}dr=null}})})();

const TABS=[['hoy','🏠','Hoy',hoy],['cli','👥','Clientes',cli],['pro','🏷️','Promos',pro],['cam','📣','Campañas',cam],['ia','✨','IA',ia]];let cur='hoy';
let PREV=-1;
function go(t){cur=t;const ix=TABS.findIndex(x=>x[0]==t),same=ix==PREV,dir=PREV<0||same?0:Math.sign(ix-PREV);PREV=ix;
$('#hd').innerHTML=TABS[ix][2]+'<button class="gear" onclick="cfg()">⚙️</button>';
$('#mn').innerHTML='<div class="v'+(same?' rf':'')+'" style="--dx:'+dir*38+'px">'+TABS[ix][3]()+'</div>';if(!same)$('#mn').scrollTop=0;
const nv=$('#nv');if(!nv.children.length)nv.innerHTML='<i class="pill"></i>'+TABS.map(x=>`<button onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');
[...nv.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',i==ix));{const pl=nv.querySelector('.pill');pl.style.transform='translateX('+ix*100+'%)';if(!same){pl.classList.remove('sq');pl.offsetWidth;pl.classList.add('sq')}}
if(t!='cli'&&SELM){SELM=false;SEL.clear()}$('#sb').className=t=='cli'&&SELM?'on':'';if(t=='cli'&&SELM)selBar();
if(t=='cli')fl();if(t=='pro')loadThumbs();if(t=='hoy'&&!same)countUp();if(t=='ia'){drawChat();$('#qi').onkeydown=ev=>{if(ev.key=='Enter')sendQ()}}}

try{const SB=Capacitor.Plugins.StatusBar,mq=matchMedia('(prefers-color-scheme: dark)'),f=()=>SB.setStyle({style:mq.matches?'DARK':'LIGHT'});f();mq.addEventListener('change',f)}catch(x){}
go('hoy');
</script></body></html>

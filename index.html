<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bodega CRM</title><style>
:root{--bg:#edf0f5;--c:#fff;--c2:#e4e9f2;--tx:#14213d;--mu:#6b7690;--g:#1fa855;--bl:#2563eb;--or:#ff7a1a;--rd:#d93a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 6px;font-size:22px;font-weight:800;letter-spacing:-.4px}
main{flex:1;overflow-y:auto;padding:4px 14px 100px}
h3{margin:18px 2px 6px;font-size:16px}
.v{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.card{background:var(--c);border-radius:18px;padding:12px;margin:8px 0;animation:in .4s both;transition:transform .15s;box-shadow:0 1px 3px #14213d14}
.card:active{transform:scale(.975)}
.r{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:14px;background:var(--tx);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.f{flex:1;min-width:0}.f b{display:block}
small,.mu{color:var(--mu);display:block;font-size:12.5px;line-height:1.35}
.rd{color:var(--rd);font-weight:700}
.ac{display:flex;gap:8px;margin-top:10px}
.b{flex:1;border:0;border-radius:14px;padding:12px 8px;font:700 14px system-ui;background:var(--bl);color:#fff;transition:transform .12s,filter .12s}
.b:active{transform:scale(.94);filter:brightness(.9)}
.b.g{background:var(--g)}.b.o{background:var(--or)}.b.l{background:var(--c2);color:var(--tx)}
input,select,textarea{width:100%;border:0;background:var(--c2);color:var(--tx);border-radius:12px;padding:12px;margin:5px 0;font:15px system-ui}
textarea{min-height:90px;resize:none}
label{font-size:13px;color:var(--mu)}
.ch{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.ch span{padding:8px 14px;border-radius:20px;background:var(--c);white-space:nowrap;font-weight:600;transition:.2s}
.ch span.on{background:var(--tx);color:#fff}
.st{display:flex;gap:8px;margin-top:6px}.st div{flex:1;background:var(--tx);color:#fff;border-radius:16px;padding:12px;font-size:12px}.st b{display:block;font-size:26px}
.pg{height:8px;border-radius:8px;background:var(--c2);margin:8px 0;overflow:hidden}.pg i{display:block;height:100%;background:var(--g);transition:width .5s}
nav{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--tx);border-radius:24px;display:flex;padding:6px;box-shadow:0 8px 24px #14213d55}
nav button{flex:1;border:0;background:none;color:#9fb0d6;padding:8px 0;border-radius:18px;font:600 11px system-ui;transition:.25s}
nav button span{display:block;font-size:20px;transition:transform .25s}
nav button.on{background:#ffffff22;color:#fff}nav button.on span{transform:translateY(-2px) scale(1.15)}
#sh{position:fixed;inset:0;background:#14213d88;opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:flex-end}
#sh.on{opacity:1;pointer-events:auto}
.bx{background:var(--c);width:100%;max-height:90dvh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#sh.on .bx{transform:none}
.gr{width:40px;height:5px;border-radius:5px;background:var(--c2);margin:0 auto 8px}
#ts{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--tx);color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;max-width:85%}
#ts.on{opacity:1;transform:translate(-50%,0)}
#chat{max-height:52dvh;overflow-y:auto}
.m{padding:10px 12px;border-radius:16px;margin:6px 0;max-width:90%;line-height:1.4;animation:in .25s}
.m.u{background:var(--tx);color:#fff;margin-left:auto}.m.a{background:var(--c)}
.bar{display:flex;gap:6px}.bar input{flex:1}.bar button{flex:none;width:52px}
.gear{float:right;border:0;background:var(--c);border-radius:14px;width:40px;height:40px;font-size:18px}
.le{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--c2);animation:in .3s both}.le>span{font-size:20px}.le i{color:var(--mu);font-style:normal;padding:4px 8px}
.bx .ch span{background:var(--c2)}.bx .ch span.on{background:var(--tx);color:#fff}.bx .m.a{background:var(--c2)}.bx .card{background:var(--bg);box-shadow:none}
.st b{font-size:21px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const CATS={A:'Abarrotes',P:'Aseo y papel',F:'Feria',M:'Mayorista',X:'Sin clasificar'};
// [rut, nombre, teléfono, categoría, notas]
const SEED=[

['77305701-K','Andres Albarracin','958383389','P','Higiénico, toalla, servilleta, bolsa, detergente. E-commerce'],['78130297-K','Angel L2P SpA','931815515','M','Compra de todo. Llamar próximo lunes'],['76990226-0','Jamyl SpA','92175269','X','Teléfono incompleto (8 dígitos)'],['','Yris Local 57','921751069','M','Compra de todo'],['','Miguel Muñoz','956054737','F','Papelería y perfumería'],['16716408-0','Leo-María Cristina','978473181','P','Artículos de aseo, compran mucho. 2º nº 978473185'],['','Angelo Fuente Alba','987387277','X',''],['78177706-4','Tres Hermanos','957260645','M','Compra de todo y mucho - top'],
['78199928-8','Santa Economía EIRL (Mauricio Miranda)','997586362','A','Compra mucho, recién surtiendo un negocio'],['13607820-8','Erika Saez','966162817','A','Avisar queso despunte'],['17573384-1','Fabian Erice','957047224','M','Rancagua. Compra quincenal de todo'],['78102847-9','Comercializadora Weisz','981441715','A','Pallets de arroz y azúcar. Cliente potencial'],['78370642-3','Luis Silva','965857854','M','Despacho a Melipilla, compra sobre 600.000'],['78441909-6','Víctor (Panadería)','981934386','A','Compró 2 millones'],['76840502-6','Dilum Restaurant','942252957','P','Papel 4x500 en oferta'],['17336845-3','Maribel Natalia Arcos','948755324','P','Carnicería. Mucho papel. Preferir llamar (*javi)'],
['76751574-K','Comercial ATH (Pedro)','922133197','P','Mucho papel. Cotizó 500 mangas Elite'],['78291382-4','Santa Flora SpA (Cristian Miranda)','983543128','A','Compra de todo. Avisar cuando lleguen bebidas'],['','Marcela','961636386','A','Le interesan precios por pallet y corta fecha'],['13983850-5','Edisson Bonacic Rojas','957111745','M','Última compra 3 millones. Importante llamar'],['78322941-2','Minimarket Ricardo Andrés Núñez','959661230','P','Promedio 500.000, papel de 10 en 10 mangas por tipo'],['77882033-1','Dist. y Comer. Santa Juana Ltda','977646940','P','Papel higiénico, toalla, corta fecha'],['','Clientes almaceneros','942826685','A','Promedio de compra 500.000'],['77979333-8','Comercial Nietos (Alfredo)','978515834','M','Compra millones y de todo. Varios locales'],
['9182388-8','Silvia','936424876','A','Compra de todo, almacén'],['78414683-9','Limpieza Ays SpA','986484781','P','Empezando en artículos de limpieza'],['78070723-2','Agrolatino (Cristopher)','932566154','P','Ha comprado pallet de papel. 2º nº 932632323 (Genesis)'],['','Milko','949203691','P','Compra millones en aseo'],['','Felipe','','X',''],['26452795-3','Edgar','954843198','P','3 minimarkets, aseo y perfumería, de Ovalle. Preferir llamar'],['15999884-3','Carlos Ignacio Brante','964819488','P','Emprendimiento papel'],['11737106-9','Sra. Margarita','972969640','A','Minimarket en la playa, compra 3 millones'],
['78.076.635','Cesar','935595136','A','Compra millones en chocolates. Llamar y escribir'],['10228258-2','Karen','978797268','P','Interesada en papel y aseo'],['10228258-2','José Aguilera','963280936','M','Compra por encargos para varios almacenes (RUT repetido con Karen)'],['18951542-1','Isacc','940565466','M','Papel, abarrotes, un poco de todo. Prom 500.000'],['','Josep Silva','933265687','P','Compra pallet de papel'],['76549757-4','Tres Mundos','962530106','A','Mucha agua; ofrecer todos sus bebestibles. 2º nº 995419965'],['7334621-5','Felipe Lobos / Casa Blanca','968462688','P','Compró pallet de papel'],['78351458-3','Hugo Ximenez','962454930','M','Mucho abarrote, pallets de papel. Quilicura'],
['76999379-7','Alan Muñoz','968646796','M','Pirque, negocio nuevo, promedio 400.000'],['15619381-K','Maritza','976969375','A','Almacén, compra de todo un poco'],['78.065.528-3','Minimarket Daniela Alej.','972397906','M','Compra de todo, mayormente papel'],['18777480-2','Jocely Hernandez','953416737','M','Melipilla. Viene los lunes, compra por cantidad'],['','Pablo San Martin','976233136','X',''],['18.764.319-8','Jesus Peña','941714982','P','Lampa. Pallets de papel cada semana; ofrecer abarrotes']];
let S;try{S=JSON.parse(localStorage.getItem('crm1'))}catch(e){}
S=S||{c:SEED.map((r,i)=>({id:i+1,rut:r[0],name:r[1],phone:r[2],cat:r[3],note:r[4],rem:'',last:''})),p:[{id:1,t:'Oferta papel higiénico',x:'¡Hola {nombre}! 👋 Esta semana tenemos oferta en papel higiénico por mangas y pallets. ¿Te reservo stock?'}],camp:{p:1,cat:'',sent:{}}};
const uid=()=>Math.floor(Math.random()*2e9);
const mig=()=>S.c.forEach(c=>{if(!c.rems)c.rems=c.rem?[{id:uid(),d:c.rem,x:'Contactar',ok:0}]:[];if(!c.log)c.log=[];delete c.rem});
mig();
const save=()=>{try{localStorage.setItem('crm1',JSON.stringify(S))}catch(e){}};
const money=n=>'$'+Math.round(n).toLocaleString('es-CL');
const fd=t=>{const d=new Date(t);return d.toLocaleDateString('es-CL',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})};
const buys=c=>c.log.filter(l=>l.k=='compra'),tot=c=>buys(c).reduce((a,l)=>a+l.m,0),lastBuy=c=>buys(c).reduce((a,l)=>Math.max(a,l.t),0);
const ICON={nota:'📝',llamada:'📞',whatsapp:'💬',compra:'🛒','campaña':'📣'};
const seg=(c,s)=>!s||(s=='vip'?c.vip:s=='old'?(!c.last||c.last<dAgo(30)):c.cat==s);
function addLog(c,k,x,m){c.log.unshift({id:uid(),t:Date.now(),k,x:x||'',m:m||0});c.last=today()}
const e=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const cl=id=>S.c.find(c=>c.id==id),first=n=>n.split(' ')[0],fill=(t,c)=>t.replace(/\{nombre\}/g,first(c.name));
const dAgo=n=>{const d=new Date(Date.now()-n*864e5);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},today=()=>dAgo(0);
const norm=p=>{const d=(p||'').replace(/\D/g,'');return d.length==9&&d[0]=='9'?'56'+d:d.length==11&&d.startsWith('569')?d:''};
const toast=m=>{const t=$('#ts');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2300)};
const ext=u=>{location.href=u};
function wa(id,t){const c=cl(id);if(!c||!norm(c.phone))return toast('Teléfono incompleto: edítalo en la ficha');ext('https://wa.me/'+norm(c.phone)+'?text='+encodeURIComponent(t||''))}
let PEND=null;
function act(k,id,t){const c=cl(id);if(!norm(c.phone))return toast('Teléfono incompleto: edítalo en Datos');addLog(c,k=='c'?'llamada':'whatsapp',t?'Mensaje: '+t.slice(0,90):'');save();PEND={id,t:Date.now()};k=='c'?ext('tel:+'+norm(c.phone)):wa(id,t)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PEND){const p=PEND;PEND=null;if(Date.now()-p.t<18e5)setTimeout(()=>reg(p.id,'¿Cómo te fue?'),400)}});
const share=t=>{t=t.replace(/\{nombre\}/g,'');const s=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;s?s.share({text:t}).catch(()=>{}):ext('https://wa.me/?text='+encodeURIComponent(t))};
async function notify(c,r){try{const at=new Date(r.d+'T'+(r.h||'09:00')+':00');if(at<new Date())return;const l=Capacitor.Plugins.LocalNotifications;await l.requestPermissions();await l.schedule({notifications:[{id:r.id,title:'Contactar a '+c.name,body:r.x||'Recordatorio',schedule:{at}}]})}catch(x){}}
const unnotify=async id=>{try{await Capacitor.Plugins.LocalNotifications.cancel({notifications:[{id}]})}catch(x){}};
function addRem(c,d,x,h){const r={id:uid(),d,x,h:h||'',ok:0};c.rems.push(r);notify(c,r)}
function reg(id,title){const c=cl(id);$('#sh').innerHTML=`<div class="bx"><div class="gr"></div><h3>${title} · ${e(first(c.name))}</h3><div class="ch">${['No contestó','Pidió cotización','Interesado','Sin interés','Pedir que llame después'].map(t=>`<span onclick="$('#an').value='${t}'">${t}</span>`).join('')}</div><textarea id="an" placeholder="Nota: ¿qué pasó?"></textarea><input id="am" type="number" inputmode="numeric" placeholder="Monto de compra $ (solo si compró)"><label>⏰ Recordarme</label><div class="ch" id="rc">${[[0,'No'],[1,'Mañana'],[3,'En 3 días'],[7,'En 1 semana'],[14,'En 2 semanas']].map(([n,l],i)=>`<span class="${i?'':'on'}" data-n="${n}" onclick="pickR(this)">${l}</span>`).join('')}</div><button class="b g" style="width:100%;margin-top:10px" onclick="saveReg(${id})">Guardar</button></div>`;openS()}
function pickR(el){document.querySelectorAll('#rc span').forEach(x=>x.className='');el.className='on'}
function saveReg(id){const c=cl(id),x=$('#an').value.trim(),m=+$('#am').value||0,n=+document.querySelector('#rc .on').dataset.n;if(m)addLog(c,'compra',x,m);else if(x)addLog(c,'nota',x);if(n)addRem(c,dAgo(-n),'Seguimiento'+(x?': '+x:''));save();closeS();toast('Guardado');go(cur)}
function addR(id){const d=$('#rd').value;if(!d)return toast('Elige una fecha');addRem(cl(id),d,$('#rt').value.trim()||'Contactar',$('#rh').value);save();sheet(id,'r');toast('Recordatorio creado')}
function doneR(cid,rid,fromHoy){const r=cl(cid).rems.find(r=>r.id==rid);r.ok=r.ok?0:1;if(r.ok)unnotify(r.id);save();fromHoy?go('hoy'):sheet(cid,'r')}
function delR(cid,rid){const c=cl(cid);unnotify(rid);c.rems=c.rems.filter(r=>r.id!=rid);save();sheet(cid,'r')}
function snooze(cid,rid){const c=cl(cid),r=c.rems.find(r=>r.id==rid);r.d=dAgo(-1);unnotify(r.id);notify(c,r);save();go('hoy')}
function delLog(cid,lid){const c=cl(cid);c.log=c.log.filter(l=>l.id!=lid);save();sheet(cid,'h')}
const openS=()=>{const s=$('#sh');s.offsetHeight;s.className='on'},closeS=()=>{$('#sh').className=''};
$('#sh').onclick=ev=>{if(ev.target.id=='sh')closeS()};

const row=(c,i,x='')=>`<div class="card" style="animation-delay:${Math.min(i,10)*35}ms"><div class="r" onclick="sheet(${c.id},'h')"><div class="av">${e(c.name[0])}</div><div class="f"><b>${c.vip?'⭐ ':''}${e(c.name)}</b><small>${CATS[c.cat]}${tot(c)?' · '+money(tot(c)):''}${c.note?' · '+e(c.note):''}</small>${x}</div></div><div class="ac"><button class="b" onclick="act('c',${c.id})">📞 Llamar</button><button class="b g" onclick="act('w',${c.id},'')">💬 WhatsApp</button></div></div>`;

const rrow=(c,r,i)=>`<div class="card" style="animation-delay:${Math.min(i,10)*35}ms"><div class="r" onclick="sheet(${c.id},'r')"><div class="av">${e(c.name[0])}</div><div class="f"><b>${e(c.name)}</b><div>${e(r.x)}</div><small class="${r.d<today()?'rd':''}">${r.d<today()?'Atrasado · ':'Hoy · '}${r.d}${r.h?' '+r.h:''}</small></div></div><div class="ac"><button class="b" onclick="act('c',${c.id})">📞</button><button class="b g" onclick="act('w',${c.id},'')">💬</button><button class="b l" onclick="snooze(${c.id},${r.id})">+1 día</button><button class="b o" onclick="doneR(${c.id},${r.id},1)">✓ Hecho</button></div></div>`;
function hoy(){const t=today(),due=[];S.c.forEach(c=>c.rems.forEach(r=>{if(!r.ok&&r.d<=t)due.push([c,r])}));due.sort((a,b)=>(a[1].d+(a[1].h||''))<(b[1].d+(b[1].h||''))?-1:1);
const mo=new Date();mo.setDate(1);mo.setHours(0,0,0,0);const mes=S.c.reduce((n,c)=>n+buys(c).filter(l=>l.t>=mo.getTime()).reduce((a,l)=>a+l.m,0),0);
const old=dAgo(14),cold=S.c.filter(c=>norm(c.phone)&&(!c.last||c.last<old)&&!c.rems.some(r=>!r.ok)).slice(0,8);
const rea=S.c.filter(c=>buys(c).length&&Date.now()-lastBuy(c)>2592e6).sort((a,b)=>tot(b)-tot(a)).slice(0,5);
return `<div class="st"><div><b>${S.c.length}</b>clientes</div><div><b>${due.length}</b>para hoy</div><div><b>${money(mes)}</b>vendido este mes</div></div>
<h3>⏰ Para contactar hoy</h3>${due.map((x,i)=>rrow(x[0],x[1],i)).join('')||'<p class="mu">Todo al día. Crea recordatorios desde la ficha de cada cliente.</p>'}
${rea.length?'<h3>🔁 Por reactivar (+30 días sin comprar)</h3>'+rea.map((c,i)=>row(c,i,'<small>Última compra hace '+Math.floor((Date.now()-lastBuy(c))/864e5)+' días</small>')).join(''):''}
<h3>💡 Sin contacto hace más de 14 días</h3>${cold.map((c,i)=>row(c,i)).join('')}`}
let F='',Q='',SO='n';const srt=(a,b)=>SO=='t'?tot(b)-tot(a):SO=='b'?(lastBuy(a)||9e15)-(lastBuy(b)||9e15):SO=='c'?(b.last||'').localeCompare(a.last||''):a.name.localeCompare(b.name);
function cli(){return `<button class="b o" onclick="sheet(0)">＋ Nuevo cliente</button><input id="q" placeholder="Buscar nombre, RUT o teléfono" value="${e(Q)}" oninput="Q=this.value;fl()"><select onchange="SO=this.value;fl()">${[['n','Ordenar: Nombre'],['t','Ordenar: Más compras ($)'],['b','Ordenar: Compró hace más tiempo'],['c','Ordenar: Último contacto']].map(([k,v])=>`<option value="${k}" ${SO==k?'selected':''}>${v}</option>`).join('')}</select><div class="ch">${[['','Todos'],['vip','⭐ VIP'],...Object.entries(CATS)].map(([k,v])=>`<span class="${F==k?'on':''}" onclick="F='${k}';go('cli')">${v}</span>`).join('')}</div><div id="L"></div>`}
function fl(){const q=Q.toLowerCase();$('#L').innerHTML=S.c.filter(c=>(!F||(F=='vip'?c.vip:c.cat==F))&&(c.name+c.rut+c.phone+c.note).toLowerCase().includes(q)).sort(srt).map((c,i)=>row(c,i)).join('')||'<p class="mu">Sin resultados.</p>'}

let TB='h';
function sheet(id,tab){const c=id?cl(id):null;TB=c?(tab||TB):'d';const c0=c||{name:'',phone:'',rut:'',cat:'X',note:'',vip:0};
const pe=c?c.rems.filter(r=>!r.ok).length:0;
const head=c?`<h3 style="margin:6px 0 2px">${c.vip?'⭐ ':''}${e(c.name)}</h3><small>${CATS[c.cat]} · ${buys(c).length} compras · ${money(tot(c))}</small><div class="ac"><button class="b" onclick="act('c',${id})">📞 Llamar</button><button class="b g" onclick="act('w',${id},'')">💬 WhatsApp</button></div><div class="ch">${[['h','Historial'],['r','Recordatorios'+(pe?' ('+pe+')':'')],['d','Datos']].map(([k,v])=>`<span class="${TB==k?'on':''}" onclick="sheet(${id},'${k}')">${v}</span>`).join('')}</div>`:'<h3>Nuevo cliente</h3>';
$('#sh').innerHTML=`<div class="bx"><div class="gr"></div>${head}${TB=='h'?hist(c):TB=='r'?remsV(c):datos(id,c0)}</div>`;openS()}
const hist=c=>`<button class="b o" style="width:100%;margin:8px 0" onclick="reg(${c.id},'Nuevo registro')">＋ Agregar nota o compra</button><div class="r"><select id="sp">${S.p.map(p=>`<option value="${p.id}">${e(p.t)}</option>`).join('')}</select><button class="b g" style="flex:none;width:112px" onclick="sendP(${c.id})">Enviar promo</button></div>${c.note?`<div class="m a" style="max-width:100%">📌 ${e(c.note)}</div>`:''}<div>${c.log.map(l=>`<div class="le"><span>${ICON[l.k]||'•'}</span><div class="f"><b>${l.k=='compra'?'Compra '+money(l.m):l.k[0].toUpperCase()+l.k.slice(1)}</b>${l.x?`<div>${e(l.x)}</div>`:''}<small>${fd(l.t)}</small></div><i onclick="delLog(${c.id},${l.id})">✕</i></div>`).join('')||'<p class="mu">Aún no hay registros. Cada llamada o WhatsApp se anota solo.</p>'}</div>`;
const cmpR=(a,b)=>a.ok-b.ok||(a.d+(a.h||'')<b.d+(b.h||'')?-1:1);
const remsV=c=>{const t=today();return `<div class="card"><input id="rt" placeholder="¿Qué debo hacer? (ej: ofrecer pallet de papel)"><div class="r"><input id="rd" type="date" value="${dAgo(-1)}"><input id="rh" type="time" value="09:00"></div><div class="ch">${[1,3,7,14].map(n=>`<span onclick="$('#rd').value=dAgo(-${n})">en ${n} días</span>`).join('')}</div><button class="b o" style="width:100%" onclick="addR(${c.id})">＋ Agregar recordatorio</button></div>${[...c.rems].sort(cmpR).map(r=>{const late=!r.ok&&r.d<t;return `<div class="le"><span onclick="doneR(${c.id},${r.id})">${r.ok?'✅':late?'🔴':'⬜'}</span><div class="f"><b style="${r.ok?'text-decoration:line-through;opacity:.5':''}">${e(r.x)}</b><small class="${late?'rd':''}">${r.d}${r.h?' '+r.h:''}${late?' · atrasado':''}</small></div><i onclick="delR(${c.id},${r.id})">✕</i></div>`}).join('')||'<p class="mu">Sin recordatorios.</p>'}`};
const datos=(id,c)=>`<input id="fn" placeholder="Nombre" value="${e(c.name)}"><input id="fp" type="tel" placeholder="Teléfono (9XXXXXXXX)" value="${e(c.phone)}"><input id="fr" placeholder="RUT" value="${e(c.rut)}"><select id="fc">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k==c.cat?'selected':''}>${v}</option>`).join('')}</select><textarea id="fo" placeholder="Nota fija (perfil del cliente)">${e(c.note)}</textarea><label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input id="fv" type="checkbox" style="width:auto;margin:0" ${c.vip?'checked':''}> ⭐ Cliente VIP</label><div class="ac">${id?`<button class="b l" onclick="draftFor(${id})">✨ Mensaje con IA</button><button class="b l" onclick="summ(${id})">🧠 Resumir</button>`:''}<button class="b g" onclick="saveC(${id})">Guardar</button></div>${id?`<button class="b l" style="width:100%;margin-top:8px;color:var(--rd)" onclick="delC(${id})">Eliminar cliente</button>`:''}`;
function saveC(id){const c=id?cl(id):{id:uid(),last:'',rems:[],log:[]};Object.assign(c,{name:$('#fn').value.trim()||'Sin nombre',phone:$('#fp').value,rut:$('#fr').value,cat:$('#fc').value,note:$('#fo').value,vip:$('#fv').checked?1:0});const d=S.c.find(x=>x!==c&&norm(x.phone)&&norm(x.phone)==norm(c.phone));if(!id)S.c.unshift(c);save();closeS();toast(d?'Guardado. Ojo: mismo teléfono que '+d.name:'Guardado');go(cur)}
function delC(id){if(!confirm('¿Eliminar este cliente y todo su historial?'))return;cl(id).rems.forEach(r=>unnotify(r.id));S.c=S.c.filter(x=>x.id!=id);save();closeS();go(cur)}
function sendP(id){const p=S.p.find(x=>x.id==$('#sp').value);if(!p)return toast('Primero crea una promoción');act('w',id,fill(p.x,cl(id)))}
function cfg(){$('#sh').innerHTML=`<div class="bx"><div class="gr"></div><h3>Ajustes y respaldo</h3><small>${S.c.length} clientes · ${S.c.reduce((n,c)=>n+c.log.length,0)} registros</small><button class="b o" style="width:100%;margin:10px 0" onclick="expo()">Copiar respaldo</button><textarea id="imp" placeholder="Para restaurar: pega aquí el respaldo"></textarea><button class="b l" style="width:100%" onclick="impo()">Restaurar respaldo</button><p class="mu">Haz un respaldo cada semana y pégalo en un chat contigo mismo de WhatsApp.</p></div>`;openS()}
function expo(){const x=JSON.stringify(S);try{navigator.clipboard.writeText(x)}catch(z){}const p=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;p&&p.share({title:'Respaldo Bodega CRM',text:x}).catch(()=>{});toast('Respaldo copiado')}
function impo(){try{const d=JSON.parse($('#imp').value);if(!d.c||!d.p)throw 0;if(!confirm('Se reemplazarán los datos actuales. ¿Continuar?'))return;S=d;mig();save();closeS();go('hoy');toast('Respaldo restaurado')}catch(z){toast('Respaldo no válido')}}

function pro(){return `<button class="b o" onclick="psheet(0)">＋ Nueva promoción</button>${S.p.map((p,i)=>`<div class="card" style="animation-delay:${i*40}ms"><b>${e(p.t)}</b><small>${e(p.x)}</small><div class="ac"><button class="b l" onclick="psheet(${p.id})">Editar</button><button class="b" onclick="share(S.p.find(x=>x.id==${p.id}).x)">Compartir</button><button class="b g" onclick="S.camp.p=${p.id};save();go('cam')">Campaña</button></div></div>`).join('')}`}
function psheet(id){const p=id?S.p.find(x=>x.id==id):{t:'',x:''};
$('#sh').innerHTML=`<div class="bx"><div class="gr"></div><h3>${id?'Editar':'Nueva'} promoción</h3><input id="pt" placeholder="Título (ej: Oferta arroz)" value="${e(p.t)}"><textarea id="px" rows="5" placeholder="Mensaje. Usa {nombre} para personalizar">${e(p.x)}</textarea><div class="ac"><button class="b l" onclick="aiPromo()">✨ Redactar con IA</button><button class="b g" onclick="saveP(${id})">Guardar</button></div>${id?`<button class="b l" style="margin-top:8px;width:100%;color:var(--rd)" onclick="S.p=S.p.filter(x=>x.id!=${id});save();closeS();go('pro')">Eliminar</button>`:''}</div>`;openS()}
function saveP(id){const p=id?S.p.find(x=>x.id==id):{id:Date.now()%2e9};p.t=$('#pt').value||'Promoción';p.x=$('#px').value;if(!id)S.p.unshift(p);save();closeS();go('pro')}
function aiPromo(){const t=$('#pt').value;closeS();AI.cid=0;go('ia');ask('Redacta un mensaje corto de WhatsApp para esta promoción: '+t+'. Usa {nombre} donde va el nombre del cliente.')}

function cam(){const k=S.camp,tg=S.c.filter(c=>norm(c.phone)&&seg(c,k.cat)),n=tg.filter(c=>k.sent[c.id]).length;
return `<p class="mu">Elige promo y grupo. Cada botón abre WhatsApp con el mensaje listo; tú solo presionas enviar.</p><select onchange="S.camp.p=+this.value;save();go('cam')">${S.p.map(p=>`<option value="${p.id}" ${p.id==k.p?'selected':''}>${e(p.t)}</option>`).join('')}</select><select onchange="S.camp.cat=this.value;save();go('cam')"><option value="">Todos los clientes</option><option value="vip" ${k.cat=='vip'?'selected':''}>⭐ Solo VIP</option><option value="old" ${k.cat=='old'?'selected':''}>😴 Sin contacto hace 30+ días</option>${Object.entries(CATS).map(([a,b])=>`<option value="${a}" ${a==k.cat?'selected':''}>${b}</option>`).join('')}</select>
<div class="pg"><i style="width:${tg.length?n/tg.length*100:0}%"></i></div><small>${n} de ${tg.length} enviados</small>
${tg.map((c,i)=>`<div class="card" style="animation-delay:${Math.min(i,10)*30}ms"><div class="r"><div class="f"><b>${e(c.name)}</b><small>${CATS[c.cat]}</small></div><button class="b ${k.sent[c.id]?'l':'g'}" style="flex:none;width:110px" onclick="sendC(${c.id})">${k.sent[c.id]?'✓ Reenviar':'Enviar'}</button></div></div>`).join('')}
<button class="b l" style="width:100%;margin-top:8px" onclick="S.camp.sent={};save();go('cam')">Reiniciar campaña</button>`}
function sendC(id){const p=S.p.find(x=>x.id==S.camp.p)||S.p[0],c=cl(id);S.camp.sent[id]=1;addLog(c,'campaña',p.t);save();wa(id,fill(p.x,c));setTimeout(()=>go('cam'),400)}

// ===== IA sin internet (wllama + Qwen2.5). El modelo se descarga UNA vez y queda guardado =====
const AI={h:[],w:null,ready:false,cid:0,busy:false};
const MODELS={'Qwen2.5 1.5B (mejor)':'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf','Qwen2.5 0.5B (más rápido)':'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf'};
function ia(){return `<div class="card"><select id="mdl">${Object.keys(MODELS).map(k=>`<option>${k}</option>`).join('')}</select><button class="b o" onclick="loadAI()">${AI.ready?'IA activa ✓':'Activar IA'}</button><div class="pg"><i id="pb" style="width:${AI.ready?100:0}%"></i></div><small id="st">${AI.ready?'IA lista, funciona sin internet':'La primera vez descarga el modelo (con WiFi). Después funciona sin internet.'}</small></div><div class="ch">${['Ideas de promos','Cliente dice que es caro','Reactivar inactivos'].map((l,i)=>`<span onclick="AI.cid=0;ask(QP[${i}])">${l}</span>`).join('')}</div><div id="chat"></div><div class="bar"><input id="qi" placeholder="Pregúntale algo a la IA…"><button class="b g" onclick="sendQ()">➤</button></div>`}
async function loadAI(){const st=$('#st'),pb=$('#pb');if(AI.ready)return;try{st.textContent='Cargando…';const {Wllama}=await import('./wllama/index.js');AI.w=new Wllama({'single-thread/wllama.wasm':'./wllama/single-thread/wllama.wasm','multi-thread/wllama.wasm':'./wllama/multi-thread/wllama.wasm'});
await AI.w.loadModelFromUrl(MODELS[$('#mdl').value],{n_ctx:2048,allowOffline:true,progressCallback:({loaded,total})=>{pb.style.width=(loaded/total*100)+'%';st.textContent=Math.round(loaded/total*100)+'%'}});AI.ready=true;st.textContent='IA lista, funciona sin internet'}catch(x){st.textContent='Error: '+(x.message||x)}}
async function ask(t){if(!AI.ready)return toast('Primero toca “Activar IA”');if(AI.busy)return;AI.busy=true;AI.h.push({role:'user',content:t});const b={role:'assistant',content:'…'};AI.h.push(b);drawChat();
try{const sys={role:'system',content:'Eres el asistente de ventas de una bodega mayorista en Chile. Responde siempre en español, breve y cercano. Al redactar mensajes de WhatsApp usa tono amable y vendedor, con pocos emojis.'};
b.content=await AI.w.createChatCompletion([sys,...AI.h.slice(0,-1).slice(-6)],{nPredict:220,sampling:{temp:.7,top_p:.9},onNewToken:(a,p,s)=>{b.content=s;drawChat()}})}catch(x){b.content='Error: '+(x.message||x)}AI.busy=false;drawChat()}
function sendQ(){const i=$('#qi'),v=i.value.trim();if(v){i.value='';ask(v)}}
function cp(i){navigator.clipboard&&navigator.clipboard.writeText(AI.h[i].content);toast('Copiado')}
function drawChat(){const el=$('#chat');if(!el)return;const n=AI.h.length-1;el.innerHTML=AI.h.map((m,i)=>`<div class="m ${m.role[0]}">${e(m.content).replace(/\n/g,'<br>')}${i==n&&m.role=='assistant'&&!AI.busy?`<div class="ac"><button class="b l" onclick="cp(${i})">Copiar</button>${AI.cid?`<button class="b g" onclick="act('w',${AI.cid},AI.h[${i}].content)">💬 Enviar</button>`:''}</div>`:''}</div>`).join('');el.scrollTop=el.scrollHeight}
const QP=['Dame 5 ideas de promociones para esta semana en una bodega mayorista de abarrotes, aseo y papel.','¿Cómo respondo por WhatsApp si un cliente dice que mis precios son caros?','Redacta un mensaje corto para reactivar a clientes que dejaron de comprar.'];
const hx=c=>c.log.slice(0,4).map(l=>fd(l.t)+' '+l.k+(l.m?' '+money(l.m):'')+' '+l.x).join('; ').slice(0,400);
function draftFor(id){const c=cl(id);closeS();AI.cid=id;go('ia');ask('Redacta un mensaje corto de WhatsApp para '+c.name+'. Perfil: '+c.note+'. Historial reciente: '+hx(c)+'. Objetivo: retomar contacto y ofrecerle una promoción.')}
function summ(id){const c=cl(id);closeS();AI.cid=0;go('ia');ask('Resume en 3 líneas mi relación con este cliente y sugiere el siguiente paso. Cliente: '+c.name+'. Perfil: '+c.note+'. Historial: '+hx(c))}

const TABS=[['hoy','🏠','Hoy',hoy],['cli','👥','Clientes',cli],['pro','🏷️','Promos',pro],['cam','📣','Campañas',cam],['ia','✨','IA',ia]];let cur='hoy';
function go(t){cur=t;$('#hd').innerHTML=TABS.find(x=>x[0]==t)[2]+'<button class="gear" onclick="cfg()">⚙️</button>';$('#mn').innerHTML='<div class="v">'+TABS.find(x=>x[0]==t)[3]()+'</div>';$('#nv').innerHTML=TABS.map(x=>`<button class="${x[0]==t?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');if(t=='cli')fl();if(t=='ia'){drawChat();$('#qi').onkeydown=ev=>{if(ev.key=='Enter')sendQ()}}}
go('hoy');
</script></body></html>
